name: nexaim-wechat-customer

services:
  business-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      WECHAT_APP_ID: ${WECHAT_APP_ID:?WECHAT_APP_ID is required}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?WECHAT_APP_SECRET is required}
      NEXAIM_API_BASE_URL: ${NEXAIM_API_BASE_URL:?NEXAIM_API_BASE_URL is required}
      NEXAIM_WS_BASE_URL: ${NEXAIM_WS_BASE_URL:?NEXAIM_WS_BASE_URL is required}
      NEXAIM_APP_ID: ${NEXAIM_APP_ID:?NEXAIM_APP_ID is required}
      NEXAIM_APP_KEY: ${NEXAIM_APP_KEY:?NEXAIM_APP_KEY is required}
      NEXAIM_APP_SECRET: ${NEXAIM_APP_SECRET:?NEXAIM_APP_SECRET is required}
    ports:
      - "127.0.0.1:${BUSINESS_HTTP_PORT:-3100}:3100"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
